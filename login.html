<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오 로그인 | 아침 카카오 우선순위 알림</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-view">
    <section class="login-card card" aria-labelledby="login-title" aria-describedby="login-description login-security">
      <p class="eyebrow">Morning Kakao Brief</p>
      <h1 id="login-title">카카오로 시작하기</h1>
      <p id="login-description" class="login-description">
        카카오 계정으로 안전하게 로그인하면 내 할 일을 계정별로 정리하고 다시 확인할 수 있어요.
      </p>

      <a class="kakao-login-button" href="/auth/kakao">카카오로 계속하기</a>

      <p id="login-feedback" class="login-feedback" role="status" aria-live="polite"></p>
      <p id="login-security" class="login-security">
        카카오 아이디와 비밀번호는 이 서비스에 입력하거나 저장하지 않으며, 인증은 카카오 화면에서 진행됩니다.
      </p>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
